# Test vhost: mekarpeles.com -> the FastAPI app on NEW (nginx serves /static directly, proxies the rest).
# Once validated here, the same block can serve mek.fyi / michaelkarpeles.com.
server {
    listen 443 ssl;
    server_name mekarpeles.com www.mekarpeles.com;

    # static assets straight from the checkout (fast; bypasses the app)
    location /static/ {
        alias /srv/michaelkarpeles.com/mekarpeles/static/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    ssl_certificate /etc/letsencrypt/live/mekarpeles.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mekarpeles.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
}
server {
    listen 80;
    server_name mekarpeles.com www.mekarpeles.com;
    return 301 https://$host$request_uri;
}
